# Used in 05 (pods): init container + native sidecar + app sharing a volume, with a preStop hook.
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web-pod
spec:
  terminationGracePeriodSeconds: 30
  volumes:
  - name: logs
    emptyDir: {}
  initContainers:
  - name: wait-for-dns
    image: busybox:1.36
    command: ["sh", "-c", "until nslookup kubernetes.default.svc.cluster.local; do echo waiting; sleep 2; done"]
  - name: log-shipper
    image: busybox:1.36
    restartPolicy: Always
    command: ["sh", "-c", "touch /logs/app.log; tail -F /logs/app.log"]
    volumeMounts:
    - name: logs
      mountPath: /logs
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "while true; do date >> /logs/app.log; sleep 5; done"]
    volumeMounts:
    - name: logs
      mountPath: /logs
    lifecycle:
      preStop:
        exec:
          command: ["sh", "-c", "sleep 5"]
